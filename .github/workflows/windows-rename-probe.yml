name: Windows directory rename diagnostic
on:
  push:
    branches: [ci/windows-x64]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-rename-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check-windows-rename-probe.py

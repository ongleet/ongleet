# Copied to the application's user config directory on first use.
# Arguments are literal; use config.shellCommand explicitly for shell syntax.
env: {}
actions:
  - id: bash
    name: Bash
    kind: terminal
    config:
      executable: bash
      args: []
      env: {}
  - id: codex
    name: Codex
    kind: terminal
    config:
      executable: ong-codex
      args: []
      env: {}
  - id: files
    name: Files
    kind: files
    config: {}
  - id: pull-request
    name: Pull request
    kind: pull-request
    config: {}
  - id: diff
    name: Diff
    kind: diff
    config: {}

[package]
name = "devcenter"
version = "0.1.0"
default-run = "devcenter-gui"
edition = "2021"
rust-version = "1.98"

[[bin]]
name = "devcenter-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"

[package]
name = "ongleet"
version = "0.1.0"
license = "MIT"
default-run = "ongleet-gui"
edition = "2021"
rust-version = "1.98"

[[bin]]
name = "ongleet-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
diesel = { version = "2.3", features = ["sqlite"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "macros"] }

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL", "NSEnumerator"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0.2"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
http = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
